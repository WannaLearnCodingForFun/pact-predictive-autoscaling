global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: service
    static_configs:
      - targets: ["service:8080"]
    metrics_path: /metrics
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
