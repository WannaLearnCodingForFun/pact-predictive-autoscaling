<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PACT dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="strip">
      <span class="brand">PACT</span>
      <span id="bind">127.0.0.1</span>
      <span id="ws-state" class="muted">connecting</span>
    </header>
    <main class="grid">
      <section class="panel" data-panel="replicas">
        <h2>Replicas vs demand</h2>
        <div id="chart-replicas" class="chart"></div>
      </section>
      <section class="panel" data-panel="latency">
        <h2>Latency</h2>
        <div id="chart-latency" class="chart"></div>
      </section>
      <section class="panel" data-panel="forecast">
        <h2>Forecast overlay</h2>
        <div id="chart-forecast" class="chart"></div>
      </section>
      <section class="panel" data-panel="control">
        <h2>Control internals</h2>
        <div id="chart-control" class="chart"></div>
      </section>
      <section class="panel" data-panel="actions">
        <h2>Action log</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>tick</th>
                <th>u*</th>
                <th>rate</th>
                <th>bounds</th>
                <th>deadband</th>
                <th>cooldown</th>
                <th>applied</th>
                <th>reason</th>
              </tr>
            </thead>
            <tbody id="action-log"></tbody>
          </table>
        </div>
      </section>
      <section class="panel tiles" data-panel="tiles">
        <h2>Metrics</h2>
        <div class="tile-row">
          <div class="tile"><span class="label">SLA violation</span><span id="tile-sla">—</span></div>
          <div class="tile"><span class="label">Over-provision</span><span id="tile-over">—</span></div>
          <div class="tile"><span class="label">Scale actions</span><span id="tile-actions">—</span></div>
          <div class="tile"><span class="label">Mean utilisation</span><span id="tile-util">—</span></div>
          <div class="tile"><span class="label">Overrides</span><span id="tile-ovr">—</span></div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
